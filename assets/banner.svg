<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-labelledby="t d">
<title id="t">Higgsfield Studio</title>
<desc id="d">Todo Higgsfield dentro de Claude: un agente y 17 skills. Mesa de control con ocho canales encendidos: imagen, video, audio, 3D, anuncios, UGC, personajes y efectos.</desc>
<style>
.disp{font-family:Impact,Haettenschweiler,'Arial Narrow Bold','Franklin Gothic Bold','Helvetica Neue',sans-serif;font-weight:700}
.mono{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.hueso{fill:#f1efe6}.lima{fill:#cdfb3c}.tenue{fill:#f1efe6;opacity:.56}
.seg{fill:#cdfb3c;opacity:.13}.seg.pico{fill:#ff5a36}
.num{font-size:10px;fill:#f1efe6;opacity:.4;letter-spacing:1px}
.canal{font-size:12px;fill:#f1efe6;letter-spacing:1.5px}
.led{fill:#cdfb3c;animation:parpadeo 2.4s steps(1,end) infinite}
.vivo{fill:#ff5a36;animation:parpadeo 1.2s steps(1,end) infinite}
.sube{animation:sube .9s cubic-bezier(.2,.7,.2,1) both}
.r1{animation-delay:.05s}.r2{animation-delay:.18s}.r3{animation-delay:.34s}.r4{animation-delay:.5s}.r5{animation-delay:.62s}
.barrido{animation:barrido 7s linear infinite}
.cursor{animation:parpadeo 1.1s steps(1,end) infinite}
@keyframes sube{from{transform:translateY(14px)}to{transform:none}}
@keyframes parpadeo{0%,62%{opacity:1}63%,100%{opacity:.18}}
@keyframes barrido{from{transform:translateX(-80px)}to{transform:translateX(1360px)}}
@keyframes n1{0%,5%{opacity:.13}8%,91%{opacity:1}94%,100%{opacity:.13}}@keyframes n2{0%,10%{opacity:.13}13%,86%{opacity:1}89%,100%{opacity:.13}}@keyframes n3{0%,15%{opacity:.13}18%,81%{opacity:1}84%,100%{opacity:.13}}@keyframes n4{0%,20%{opacity:.13}23%,76%{opacity:1}79%,100%{opacity:.13}}@keyframes n5{0%,25%{opacity:.13}28%,71%{opacity:1}74%,100%{opacity:.13}}@keyframes n6{0%,30%{opacity:.13}33%,66%{opacity:1}69%,100%{opacity:.13}}@keyframes n7{0%,35%{opacity:.13}38%,61%{opacity:1}64%,100%{opacity:.13}}@keyframes n8{0%,40%{opacity:.13}43%,56%{opacity:1}59%,100%{opacity:.13}}@keyframes n9{0%,45%{opacity:.13}48%,51%{opacity:1}54%,100%{opacity:.13}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.seg{opacity:.85}}
</style>
