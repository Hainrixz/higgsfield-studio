<linearGradient id="haz" x1="0" x2="1"><stop offset="0" stop-color="#cdfb3c" stop-opacity="0"/><stop offset=".5" stop-color="#cdfb3c" stop-opacity=".1"/><stop offset="1" stop-color="#cdfb3c" stop-opacity="0"/></linearGradient>
